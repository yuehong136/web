<!doctype html>
<html lang="en">
  <head>
    <!-- 防闪烁：在 CSS 加载前立即设置主题 -->
    <script>
      (function() {
        var path = window.location.pathname || '';
        var isShareRoute = path.indexOf('/agent/share') === 0 || path.indexOf('/chats/widget') === 0;

        if (isShareRoute) {
          // 分享 / 嵌入路由：URL 上的 theme 严格优先，避免被宿主 localStorage 干扰
          try {
            var urlTheme = new URLSearchParams(window.location.search).get('theme');
            if (urlTheme === 'light' || urlTheme === 'dark') {
              document.documentElement.setAttribute('data-theme', urlTheme);
              return;
            }
          } catch (_) {}
        }

        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        } else {
          // 系统偏好检测
          var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/svg/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>沧溟 AI</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- iconfont 图标库（来自 ragflow） -->
    <script src="/iconfont.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
