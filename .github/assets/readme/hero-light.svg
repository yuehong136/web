<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Multi-RAG — From knowledge to action</title>
  <desc id="description">A conceptual workflow connecting knowledge and retrieval to agents, MCP tools and applications. This is an illustration, not a product screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3b82f6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cedcf0"/>
    </pattern>
    <clipPath id="bounds"><rect width="1280" height="440" rx="24"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .ink { fill: #13233f; }
      .muted { fill: #526884; }
      .accent { fill: #2563eb; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .panel { fill: #ffffff; stroke: #dbe5f2; }
      .wire { stroke: #82a9e6; stroke-width: 1.5; }
    </style>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="440" fill="url(#background)"/>
    <rect x="640" width="640" height="392" fill="url(#dots)"/>
    <ellipse cx="975" cy="218" rx="310" ry="244" fill="url(#glow)"/>
    <circle cx="970" cy="223" r="155" stroke="#d7e5f8"/>
    <circle cx="970" cy="223" r="208" stroke="#d7e5f8" stroke-dasharray="3 9"/>
    <path d="M640 48V366" stroke="#dbe5f2" stroke-dasharray="3 7"/>

    <!-- Static rendering of the existing project's concentric blue mark. -->
    <g transform="translate(52 36) scale(.62)">
      <circle cx="36" cy="36" r="25" stroke="url(#blue)" stroke-width="3.5" stroke-dasharray="55 20" stroke-linecap="round" transform="rotate(-10 36 36)"/>
      <circle cx="36" cy="36" r="16" stroke="url(#blue)" stroke-width="3" stroke-dasharray="32 16" stroke-linecap="round" transform="rotate(15 36 36)"/>
      <circle cx="36" cy="36" r="6.5" fill="url(#blue)"/>
    </g>
    <text x="108" y="64" class="ink" font-size="22" font-weight="650" letter-spacing="-.5">Multi-RAG <tspan class="muted" font-size="15" font-weight="400">/ Frontend</tspan></text>
    <text x="56" y="137" class="accent mono" font-size="12" letter-spacing="2.2">OPEN SOURCE · AI WORKSPACE</text>
    <text x="52" y="211" class="ink" font-size="62" font-weight="750" letter-spacing="-2.8">From knowledge</text>
    <text x="52" y="281" class="ink" font-size="62" font-weight="750" letter-spacing="-2.8">to <tspan class="accent">action.</tspan></text>
    <text x="56" y="326" class="muted" font-size="18">Build with your documents, models and tools.</text>

    <!-- Conceptual flow; no synthetic product data or execution claims. -->
    <path d="M841 152V169Q841 180 852 180H925Q936 180 936 192" class="wire"/>
    <path d="M1090 128V156Q1090 168 1078 168H1058Q1046 168 1046 192" class="wire" stroke-dasharray="4 5"/>
    <path d="M846 339H887Q900 339 900 326V288" class="wire" stroke-dasharray="4 5"/>
    <path d="M1003 288V302Q1003 314 1015 314H1099Q1111 314 1111 326" class="wire"/>
    <circle cx="936" cy="192" r="3.5" fill="#2563eb"/>
    <circle cx="1003" cy="288" r="3.5" fill="#2563eb"/>

    <rect x="728" y="74" width="230" height="78" rx="14" class="panel"/>
    <text x="750" y="103" class="accent mono" font-size="11" letter-spacing="1.5">01 / CONTEXT</text>
    <text x="750" y="131" class="ink" font-size="21" font-weight="600">Knowledge</text>
    <path d="M920 99H932M920 106H932M920 113H928" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="1061" y="90" width="144" height="38" rx="19" class="panel"/>
    <circle cx="1081" cy="109" r="3" fill="#2563eb"/>
    <text x="1094" y="114" class="muted mono" font-size="13">MCP tools</text>

    <rect x="820" y="192" width="270" height="96" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".65"/>
    <text x="844" y="222" class="accent mono" font-size="11" letter-spacing="1.5">02 / ORCHESTRATE</text>
    <text x="844" y="253" class="ink" font-size="25" font-weight="650">Agents</text>
    <text x="844" y="273" class="muted" font-size="13">Prompts · Workflows · Structured output</text>
    <g transform="translate(1038 231)" stroke="#2563eb" stroke-width="1.5">
      <rect width="10" height="10" rx="2"/>
      <rect x="16" y="16" width="10" height="10" rx="2"/>
      <path d="M10 5H21V16"/>
    </g>

    <rect x="678" y="320" width="168" height="38" rx="19" class="panel"/>
    <circle cx="698" cy="339" r="3" fill="#2563eb"/>
    <text x="711" y="344" class="muted mono" font-size="13">Retrieval</text>

    <rect x="1000" y="326" width="228" height="64" rx="14" class="panel"/>
    <text x="1022" y="350" class="accent mono" font-size="11" letter-spacing="1.5">03 / DELIVER</text>
    <text x="1022" y="376" class="ink" font-size="21" font-weight="600">Applications</text>
    <path d="M1190 353H1204M1199 348L1204 353L1199 358" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M52 390H958" stroke="#dbe5f2"/>
    <text x="56" y="417" class="muted mono" font-size="11" letter-spacing="1.1">KNOWLEDGE / AGENTS / APPLICATIONS</text>
    <text x="1228" y="417" text-anchor="end" class="muted mono" font-size="11" letter-spacing="1.1">ONE CONNECTED WORKSPACE</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="439" rx="23.5" stroke="#dbe5f2"/>
</svg>
