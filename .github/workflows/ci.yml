name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint & Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall 跑 patch-package（patches/ 已提交），prepare 跑 husky
      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: File size ratchet
        run: npm run lint:file-size

      - name: Internationalization ratchet (committed changes)
        env:
          I18N_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-agent-i18n-hardcoded.mjs --base "$I18N_BASE" --head HEAD

      - name: Translation type contracts
        run: npm run check:i18n-types

      - name: ESLint (type-aware, Agent critical dirs)
        run: npm run lint:typed

      - name: ESLint (desktop shell)
        run: npm run lint:desktop

      - name: Typecheck (Agent strict)
        run: npm run typecheck:agent-strict

      - name: Typecheck (desktop shell)
        run: npm run desktop:typecheck

      - name: Test (complete inventory)
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc -b（全量类型检查）+ vite build
      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle-size

      - name: Install browser for controlled workspace regression
        run: npx playwright install --with-deps chromium

      - name: Workspace browser regression (controlled HTTP/SSE fixtures)
        run: npm run test:browser:production

      - name: Route static dependency closures
        run: npm run profile:routes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-evidence
          path: output/playwright/round2/
          if-no-files-found: ignore

      - name: Build Electron main and preload
        run: npm run desktop:build

      - name: Assemble desktop staging app
        run: npm run desktop:stage

      - name: Verify desktop staging allowlist
        run: npm run desktop:verify:stage
